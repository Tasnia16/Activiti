name: Run Activiti Test with Trace

on:
  workflow_dispatch:    # lets you run it manually

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b11f757a48600e53aaf3fcb7a3ba1ece6c463cb4   # your exact commit

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run OD test (cCreateStandaloneTaskReleaseUnAuthorized)
        run: |
          cd activiti-core/activiti-spring-boot-starter
          mvn -B -U test \
            -Dtest=TaskRuntimeClaimReleaseTest#cCreateStandaloneTaskReleaseUnAuthorized \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true
