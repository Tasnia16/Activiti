name: Run Activiti Test with Trace
on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b11f757a48600e53aaf3fcb7a3ba1ece6c463cb4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run the OD test (real dynamic trace)
        run: |
          mvn -B -U test \
            -pl activiti-spring-boot-starter \
            -Dtest=org.activiti.spring.boot.tasks.TaskRuntimeClaimReleaseTest#cCreateStandaloneTaskReleaseUnAuthorized \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true || true
