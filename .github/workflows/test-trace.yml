- name: Run the OD test (real dynamic trace)
        run: |
          mvn -B -U -Dparent.relativePath= test \
            -pl activiti-spring-boot-starter \
            -Dtest=org.activiti.spring.boot.tasks.TaskRuntimeClaimReleaseTest#cCreateStandaloneTaskReleaseUnAuthorized \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true || true
